[package]
name = "easy_time"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Mohamad Al zohbie <alzoubi528@gmail.com>"]

description = "Human-friendly, DST-safe date arithmetic for chrono: days_from_now, months_ago, start_of, end_of, humanize"
documentation = "https://docs.rs/easy_time"
homepage = "https://github.com/mohamadzoh/easy_time"
repository = "https://github.com/mohamadzoh/easy_time"
readme = "README.md"
keywords = ["time", "date", "datetime", "easy", "chrono"]
license = "MIT OR Apache-2.0"
categories = ["date-and-time"]
exclude = ["target/", ".github/", ".gitignore", ".jit/"]

[dependencies]
chrono = "0.4.43"

[dev-dependencies]
chrono-tz = "0.10.4"
